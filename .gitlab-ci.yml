# =========================================================================
# GitLab CI/CD Pipeline - Mortgage Loan Catalogs Go & Kong BFF
# =========================================================================

stages:
  - test
  - build
  - smoke-test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# -------------------------------------------------------------------------
# 1. Stage Test: Pruebas unitarias y detección de condiciones de carrera
# -------------------------------------------------------------------------
unit-tests:
  stage: test
  image: golang:alpine
  before_script:
    - apk add --no-cache git build-base
    - cd mortgage-loan-catalogs-go
    - go mod download
  script:
    - go vet ./...
    - go test -v -race -coverprofile=coverage.out ./internal/... ./cmd/... ./api/...
  artifacts:
    paths:
      - mortgage-loan-catalogs-go/coverage.out
    expire_in: 7 days

# -------------------------------------------------------------------------
# 2. Stage Build: Compilación de imágenes Docker
# -------------------------------------------------------------------------
build-images:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker build -t mortgage-loan-catalogs-go:latest ./mortgage-loan-catalogs-go
    - docker build -t finnflow-mock:latest -f ./mortgage-loan-catalogs-go/Dockerfile.mock ./mortgage-loan-catalogs-go

# -------------------------------------------------------------------------
# 3. Stage Smoke Test: Verificación de integración E2E con Docker Compose
# -------------------------------------------------------------------------
integration-smoke-test:
  stage: smoke-test
  image: docker/compose:latest
  services:
    - docker:dind
  script:
    - cd kong-bff-gateway
    - docker compose up -d --build
    - sleep 10
    - apk add --no-cache curl
    - curl -i -f http://docker:8000/health
    - curl -i -f http://docker:8000/swagger-ui.html
    - curl -s -X POST http://docker:8000/v1/bfcl/mortgage-loan/catalogs/Destino -H "Content-Type: application/json" -d '{"client_type":"NATURAL"}' | grep "Vivienda Principal"
    - docker compose down
